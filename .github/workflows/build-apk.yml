name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore google-services.json (enables Firebase cloud sync)
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/wcd.apk

      - name: Publish to Releases
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest APK build
          body: |
            Automated release build of the WCD Notification Listener Android app.
            Debug-signed — for personal test installs, not for Play Store distribution.
            Captured notifications are stored on-device (Room) and synced to Firebase Realtime Database.
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          artifacts: "app/build/outputs/apk/release/wcd.apk"
